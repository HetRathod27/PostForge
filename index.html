<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostForge - AI Content Studio</title>
    <meta name="description" content="AI Content Studio: Transform raw event notes and photos into platform-native posts for LinkedIn, Instagram, X, Reddit, and WhatsApp with Honesty Guard and Voice DNA." />
    <meta property="og:title" content="PostForge - AI Content Studio" />
    <meta property="og:description" content="AI Content Studio: Transform raw event notes and photos into platform-native posts for LinkedIn, Instagram, X, Reddit, and WhatsApp with Honesty Guard and Voice DNA." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('postforge_theme_mode_v1');
          if (mode === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-violet-500/30 selection:text-violet-200 min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
